[package]
name = "testinference"
version = "0.1.0"
description = "TestInference — AI-driven end-to-end test automation"
authors = ["TestInference"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "testinference_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
tauri-plugin-dialog = "2.7.3"

# Secrets live in the OS keychain, never on disk.
#
# Each platform needs its own backend named. With none named, keyring
# quietly falls back to a store in memory — it compiles, it appears to
# work, and every key is gone when the application closes. So a platform
# that is not listed here does not keep keys, and says nothing about it.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
